<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健康证明查验</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 16px;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        .title {
            text-align: center;
            font-size: 22px;
            font-weight: 500;
            color: #333;
            margin: 24px 0;
        }
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card-header {
            background: linear-gradient(90deg, #5ed09c, #40b8c4);
            color: white;
            text-align: center;
            padding: 16px;
            font-size: 20px;
            font-weight: 500;
        }
        .card-body {
            padding: 20px;
            background: linear-gradient(180deg, #e6f9f2, #ffffff);
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 10px;
        }
        .user-info {
            font-size: 18px;
            color: #333;
            line-height: 1.5;
            white-space: nowrap;
        }
        .status-tag {
            font-size: 36px;
            font-weight: bold;
            color: #40b894;
            opacity: 0.8;
            white-space: nowrap;
        }
        .divider {
            border-bottom: 2px dashed #cad7e3;
            margin-bottom: 24px;
        }
        .detail-item {
            display: flex;
            align-items: center;
            font-size: 18px;
            color: #333;
            margin-bottom: 16px;
            line-height: 1.5;
            white-space: nowrap;
        }
        .detail-label {
            min-width: 80px;
            flex-shrink: 0;
        }
        .detail-value {
            flex-grow: 1;
            white-space: nowrap;
            overflow: visible;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">从业人员健康证明</div>
            <div class="card-body">
                <div class="top-row">
                    <div class="user-info">
                        牟伦爱 &nbsp;&nbsp; 男 39岁<br>
                        3203************774
                    </div>
                    <div class="status-tag">[有效]</div>
                </div>
                <div class="divider"></div>
                <div class="detail-item">
                    <div class="detail-label">编 号</div>
                    <div class="detail-value">苏320214026056010729号</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">体检机构</div>
                    <div class="detail-value">无锡金卫门诊部</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">有效期至</div>
                    <div class="detail-value">2027-05-08</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
